---
types:
  simple-authorization:
    type: object
    aliases:
      - authentication
    description: |-
      The recommended way to configure config-based authorization
      is using the top-level `authorization` block. However, this
      localized block can be used to override the top-level credentials.

    properties:
      username:
        reloadable: not-reloadable
        type: string
        description: |-
          Specifies a global user name that clients can use to authenticate
          the server (requires `password`, exclusive of `token`).
        aliases:
          - user

      password:
        reloadable: not-reloadable
        type: string
        description: |-
          Specifies a global password that clients can use to authenticate
          the server (requires `user`, exclusive of `token`).
        aliases:
          - pass

      token:
        reloadable: not-reloadable
        type: string
        description: |-
          Specifies a global token that clients can use to authenticate with
          the server (exclusive of `user` and `password`).

      timeout:
        reloadable: not-reloadable
        type: float
        default: 1
        description: |-
          Maximum number of seconds to wait for a client to authenticate.

    examples:
      - label: Username/password
        value: |
          authorization {
            username: app
            password: s3cret!
          }

      - label: Token
        value: |
          authorization {
            token: 6d37bfcc-3eba-4f1f-a6e9-88a3c6ddbf9c
          }

  network-authorization:
    type: object
    examples:
      - label: Username/password
        value: |
          authorization {
            username: app
            password: s3cret!
          }

    properties:
      username:
        reloadable: not-reloadable
        type: string
        description: |-
          User name the connecting server authenticates with
          (requires `password`).
        aliases:
          - user

      password:
        reloadable: not-reloadable
        type: string
        description: |-
          Password the connecting server authenticates with
          (requires `username`).
        aliases:
          - pass

      users:
        reloadable: not-reloadable
        type: array(user)
        description: |-
          A list of multiple users with different credentials.

      default_permissions:
        reloadable: reloadable
        reloadable_note: |-
          Deprecated form; also ignored entirely if a top-level
          cluster{permissions} block is present (opts.go:2074).
        type: permissions
        description: |-
          The default permissions applied to users, if permissions are
          not explicitly defined for them.

      timeout:
        reloadable: not-reloadable
        type: float
        default: 1
        description: |-
          Maximum number of seconds to wait for a client to authenticate.

  authorization:
    type: object
    examples:
      - label: Username/password
        value: |
          authorization {
            username: app
            password: s3cret!
          }

      - label: Token
        value: |
          authorization {
            token: 6d37bfcc-3eba-4f1f-a6e9-88a3c6ddbf9c
          }

      - label: Users and default permissions
        value: |
          authorization {
            default_permissions: {
              publish: "app.services.*"
              subscribe: {
                deny: "_INBOX.>"
              }
            }
            users: [
              {
                username: pam,
                password: pam,
                permissions: {
                  subscribe: "_pam.>"
                }
              },
              {
                username: joe,
                password: joe,
                permissions: {
                  subscribe: "_joe.>"
                }
              }
            ]
          }

    properties:
      username:
        reloadable: reloadable
        reloadable_note: |-
          usernameOption embeds authOption, so the reload re-authenticates
          every live connection against the new simple-auth username; clients
          still presenting the old one are disconnected.
        type: string
        description: |-
          Specifies a global user name that clients can use to authenticate
          the server (requires `password`, exclusive of `token`).
        aliases:
          - user

      password:
        reloadable: reloadable
        reloadable_note: |-
          passwordOption embeds authOption, so the reload re-authenticates
          every live connection against the new simple-auth password; clients
          still presenting the old one are disconnected.
        type: string
        description: |-
          Specifies a global password that clients can use to authenticate
          the server (requires `user`, exclusive of `token`).
        aliases:
          - pass

      token:
        reloadable: reloadable
        reloadable_note: |-
          Mapped to Options.Authorization; authorizationOption embeds
          authOption so the reload re-checks every live connection against the
          new token and disconnects the ones holding the old one.
        type: string
        description: |-
          Specifies a global token that clients can use to authenticate with
          the server (exclusive of `user` and `password`).

      users:
        properties:
          allowed_connection_types:
            reloadable: reloadable
          nkey:
            reloadable: reloadable
          permissions:
            properties:
              allow_responses:
                reloadable: reloadable
                properties:
                  expires:
                    reloadable: reloadable
                  max:
                    reloadable: reloadable
              publish:
                reloadable: reloadable
                properties:
                  allow:
                    reloadable: reloadable
                  deny:
                    reloadable: reloadable
              subscribe:
                reloadable: reloadable
                properties:
                  allow:
                    reloadable: reloadable
                  deny:
                    reloadable: reloadable
        reloadable: reloadable
        type: array(user)
        description: |-
          A list of multiple users with different credentials.

      default_permissions:
        properties:
          allow_responses:
            reloadable: reloadable
            reloadable_note: |-
              Folded into each user's permissions at parse time (only
              users with no explicit `permissions`). Re-applied live, but
              setPermissions resets the client's reply-tracking map on
              EVERY reload, so a service still owing a response for a
              request received before the reload loses permission to
              publish it.
            properties:
              expires:
                reloadable: reloadable
                reloadable_note: |-
                  Folded into each user's permissions at parse time
                  (only users with no explicit `permissions`).
                  Re-applied live, but setPermissions resets the
                  client's reply-tracking map on EVERY reload, so a
                  service still owing a response for a request
                  received before the reload loses permission to
                  publish it.
              max:
                reloadable: reloadable
                reloadable_note: |-
                  Folded into each user's permissions at parse time
                  (only users with no explicit `permissions`).
                  Re-applied live, but setPermissions resets the
                  client's reply-tracking map on EVERY reload, so a
                  service still owing a response for a request
                  received before the reload loses permission to
                  publish it.
          publish:
            reloadable: reloadable
            reloadable_note: |-
              Folded into each user's permissions while the config is
              parsed, so it only affects users with no explicit
              `permissions`; from there it follows the users path and is
              re-applied to live client connections. Not re-applied to
              existing leafnode connections.
            properties:
              allow:
                reloadable: reloadable
                reloadable_note: |-
                  Folded into each user's permissions while the config
                  is parsed, so it only affects users with no explicit
                  `permissions`; from there it follows the users path
                  and is re-applied to live client connections. Not
                  re-applied to existing leafnode connections.
              deny:
                reloadable: reloadable
                reloadable_note: |-
                  Folded into each user's permissions while the config
                  is parsed, so it only affects users with no explicit
                  `permissions`; from there it follows the users path
                  and is re-applied to live client connections. Not
                  re-applied to existing leafnode connections.
          subscribe:
            reloadable: reloadable
            reloadable_note: |-
              Folded into each user's permissions while the config is
              parsed, so it only affects users with no explicit
              `permissions`; from there it follows the users path and is
              re-applied to live client connections. Not re-applied to
              existing leafnode connections.
            properties:
              allow:
                reloadable: reloadable
                reloadable_note: |-
                  Folded into each user's permissions while the config
                  is parsed, so it only affects users with no explicit
                  `permissions`; from there it follows the users path
                  and is re-applied to live client connections. Not
                  re-applied to existing leafnode connections.
              deny:
                reloadable: reloadable
                reloadable_note: |-
                  Folded into each user's permissions while the config
                  is parsed, so it only affects users with no explicit
                  `permissions`; from there it follows the users path
                  and is re-applied to live client connections. Not
                  re-applied to existing leafnode connections.
        reloadable: reloadable
        reloadable_note: |-
          Folded into each user's permissions while the config is parsed, so
          it only affects users with no explicit `permissions`; from there it
          follows the users path and is re-applied to live client connections.
          Not re-applied to existing leafnode connections.
        type: permissions
        description: |-
          The default permissions applied to users, if permissions are
          not explicitly defined for them.

      proxy_required:
        version: "2.12"
        reloadable: not-reloadable
        type: boolean
        default: false
        description: |-
          Reject client connections that did not arrive through a PROXY
          protocol header.

      timeout:
        reloadable: reloadable
        reloadable_note: |-
          authTimeoutOption embeds noopOption, so this key alone does not
          trigger re-authorization; the new value sits in Options and is read
          when each connection is accepted. There is nothing to re-apply to an
          already-authenticated connection.
        type: float
        default: 1
        description: |-
          Maximum number of seconds to wait for a client to authenticate.

      auth_callout:
        reloadable: not-reloadable
        reloadable_note: |-
          diffOptions has no case for the AuthCallout field, so any change to
          this block - including adding or removing it - hits the default
          branch and aborts the entire reload with "config reload not
          supported for AuthCallout". Every other change in the same config
          file is discarded with it.
        type: auth-callout
        description: |-
          Enables the auth callout functionality.
          All client connections requiring authentication will have
          their credentials pass-through to a dedicated auth service.

  permissions:
    type: object
    properties:
      publish:
        reloadable: reloadable
        types:
          - string
          - array(string)
          - allow-deny-map
        description: |-
          A single subject, list of subjects, or a allow-deny map of
          subjects for publishing. Specifying a single subject or list
          of subjects denotes an *allow* and implcitly denies publishing
          to all other subjects.
        examples:
          - label: Allow publish to `foo`
            value: "foo"
          - label: Allow publish on `foo` and `bar.*`
            value: "[foo, bar.*]"
          - label: Allow publish to `foo.*` except `foo.bar`
            value: |-
              {
                allow: "foo.*"
                deny: "foo.bar"
              }

        aliases:
          - pub

      subscribe:
        reloadable: reloadable
        types:
          - string
          - array(string)
          - allow-deny-map
        description: |-
          A single subject, list of subjects, or a allow-deny map of
          subjects for subscribing. Note, that the subject permission can
          have an optional second value declaring a queue name.
        examples:
          - label: Allow subscribe on `foo`
            value: "foo"
          - label: Allow subscribe on `foo` in group matching `*.dev`
            value: "foo *.dev"
          - label: Allow subscribe on `foo.>` and `bar` in group `v1`
            value: '[foo.>, "bar v1"]'
          - label: Allow subscribe to `foo.*` except `foo.bar`
            value: |-
              {
                allow: "foo.*"
                deny: "foo.bar"
              }

        aliases:
          - sub

      allow_responses:
        reloadable: reloadable
        types:
          - boolean
          - allow-responses

  allow-deny-map:
    type: object
    properties:
      allow:
        reloadable: reloadable
        type: array(string)
        description: |-
          List of subjects that are allowed to the client.

      deny:
        reloadable: reloadable
        type: array(string)
        description: |-
          List of subjects that are denied to the client.

  allow-responses:
    type: object
    properties:
      max:
        reloadable: reloadable
        type: integer
        description: |-
          The maximum number of response messages that can be published.
      expires:
        reloadable: reloadable
        type: duration
        description: |-
          The amount of time the permission is valid. Values such
          as 1s, 1m, 1h (1 second, minute, hour) etc can be specified.
          Default doesn't have a time limit.

  auth-callout:
    type: object
    properties:
      issuer:
        reloadable: not-reloadable
        reloadable_note: |-
          diffOptions has no case for the AuthCallout field, so any change to
          this block - including adding or removing it - hits the default
          branch and aborts the entire reload with "config reload not
          supported for AuthCallout". Every other change in the same config
          file is discarded with it.
        type: string
        description: |-
          An account public NKey.

      account:
        reloadable: not-reloadable
        reloadable_note: |-
          diffOptions has no case for the AuthCallout field, so any change to
          this block - including adding or removing it - hits the default
          branch and aborts the entire reload with "config reload not
          supported for AuthCallout". Every other change in the same config
          file is discarded with it.
        type: string
        aliases: [acc]
        default: "$G"
        description: |-
          The name or public NKey of an account of the users which will
          be used by the authorization service to connect to the server.

      users:
        reloadable: not-reloadable
        reloadable_note: |-
          diffOptions has no case for the AuthCallout field, so any change to
          this block - including adding or removing it - hits the default
          branch and aborts the entire reload with "config reload not
          supported for AuthCallout". Every other change in the same config
          file is discarded with it.
        type: array(string)
        aliases: [auth_users]
        description: |-
          The names or public NKeys of users within the defined account
          that will be used by the the auth service itself and thus bypass
          auth callout.

      key:
        reloadable: not-reloadable
        reloadable_note: |-
          diffOptions has no case for the AuthCallout field, so any change to
          this block - including adding or removing it - hits the default
          branch and aborts the entire reload with "config reload not
          supported for AuthCallout". Every other change in the same config
          file is discarded with it.
        type: string
        aliases: [xkey]
        description: |-
          A public XKey that will encrypt server requests to the auth
          service.
