types:
  websocket:
    type: object
    version: 2.2
    description: |-
      If configured, the NATS server will support clients that implement
      the NATS protocol over the WebSocket transport.
    aliases:
      - ws

    properties:
      host:
        reloadable: not-reloadable
        type: host
        default: 0.0.0.0

      port:
        reloadable: not-reloadable
        type: integer
        description: |-
          Port to accept WebSocket client connections on. There is no default:
          the listener is only started once a port is set, here or via `listen`.

          TLS is required unless `no_tls` is `true`.

      listen:
        reloadable: not-reloadable
        type: listen

      advertise:
        reloadable: not-reloadable
        type: listen
        description: |-
          Advertised client `<host>:<port>`. Useful for cluster setups
          behind a NAT.

      tls:
        reloadable_note: |-
          Certificate material reloads. Changing `verify_and_map` or
          `pinned_certs` fails the reload.
        properties:
          cert_file:
            reloadable: reloadable
            reloadable_note: |-
              New connections only.
          connection_rate_limit:
            reloadable: noop
            reloadable_note: |-
              Permanent no-op.
          insecure:
            reloadable: reloadable
            reloadable_note: |-
              Meaningless for the inbound WebSocket listener.
          timeout:
            reloadable: noop
            reloadable_note: |-
              Permanent no-op, not just a reload no-op.
          verify_cert_and_check_known_urls:
            reloadable: not-reloadable
            reloadable_note: |-
              Only `false` parses, and it is then discarded (WebsocketOpts
              has no TLSCheckKnownURLs field).
        reloadable: reloadable
        type: tls
        description: |-

      no_tls:
        reloadable: not-reloadable
        type: boolean
        description: |-

      same_origin:
        reloadable: not-reloadable
        type: boolean
        default: false
        description: |-
          This option is relevant for clients used within a Web Browser, such
          as [nats.js][nats.js].

          When set to `true`, the HTTP `Origin` header must match the request’s
          hostname. Refer to [cross-origin resource sharing][cors] documentation
          for more details.

          The check only applies when the request carries an `Origin` header,
          which browsers send and non-browser clients generally do not.

          [nats.js]: https://github.com/nats-io/nats.js
          [cors]: https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS

      allowed_origins:
        reloadable: not-reloadable
        type: array(string)
        aliases:
          - allowed_origin
          - allow_origins
          - allow_origin
          - origins
          - origin
        description: |-
          The list of accepted origins. When empty, and `same_origin` is `false`,
          clients from any origin are allowed to connect.

          This list specifies the only accepted values for the client's request
          `Origin` header. The scheme, host, and port must match. By convention,
          the absence of TCP port in the URL will be port 80 for an
          "http://" scheme, and 443 for "https://".

      handshake_timeout:
        reloadable: not-reloadable
        type: duration
        description: |-
          This is the total time allowed for the server to
          read the client request and write the response back
          to the client. This includes the time needed for the
          TLS handshake.

      compress:
        reloadable: not-reloadable
        type: boolean
        aliases:
          - compression
        description: |-
          This enables support for compressed websocket frames
          in the server. For compression to be used, both server
          and client have to support it.

      authorization:
        reloadable: not-reloadable
        type: simple-authorization

      headers:
        reloadable: not-reloadable
        type: map(string)
        description: |-
          Extra HTTP headers returned on the WebSocket upgrade response.

      ping_interval:
        version: "2.12"
        reloadable: not-reloadable
        type: duration
        default: 2m
        description: |-
          How often the server sends a WebSocket ping. Set `0` to disable.

      user_cookie:
        reloadable: not-reloadable
        type: string
        description: |-
          Name of the HTTP cookie holding the user name, for clients that
          authenticate through a browser session.

      pass_cookie:
        reloadable: not-reloadable
        type: string
        description: |-
          Name of the HTTP cookie holding the password.

      token_cookie:
        reloadable: not-reloadable
        type: string
        description: |-
          Name of the HTTP cookie holding the auth token.

      jwt_cookie:
        reloadable: not-reloadable
        type: string
        description: |-
          Name of the HTTP cookie, that, if present, will be used as a client JWT.
          The cookie should be set by the HTTP server as described [here][cookie].
          This setting is useful when generating NATS `Bearer` client JWTs as the
          result of some authentication mechanism. The HTTP server after correct
          authentication can issue a JWT for the user, that is set securely
          preventing access by unintended scripts. Note these JWTs must be
          [NATS JWTs][jwt].

          **Note:** If the client specifies a JWT in the `CONNECT` protocol,
          this option is ignored.

          [cookie]: https://developer.mozilla.org/en-US/docs/Web/HTTP/Cookies#restrict_access_to_cookies
          [jwt]: https://docs.nats.io/nats-server/configuration/securing_nats/jwt

      no_auth_user:
        reloadable: not-reloadable
        type: string
        description: |-
          If no user name is provided when a WebSocket client connects, will
          default this user name in the authentication phase. If specified, this
          will override, for WebSocket clients, any `no_auth_user` value defined
          in the main configuration file.

          A leaf node connecting over WebSocket also picks this value up in
          preference to the top-level `no_auth_user`.

          *Note: that this is not compatible with running the server in
          operator mode.*

    examples:
      - label: No-TLS for development
        description: |-
          This is the simplest way to get started during development.

        value: |-
          websocket {
            port: 8080
            no_tls: true
          }

      - label: No-TLS with fontend Web proxy
        description: |-
          If a frontend Web proxy is being used that performs TLS termination,
          TLS can be disabled for the WebSocket transport combined with the
          `advertise` to ensure clients get the proper endpoint.

        value: |-
          websocket {
            port: 8080
            no_tls: true
            advertise: nats.example.org
          }
