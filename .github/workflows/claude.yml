name: Claude Code

# GITHUB_TOKEN needs contents:read and actions:read — required by
# claude-code-action for restoring trusted config files from the base branch.
# All other GitHub API access uses the App token.
permissions:
  contents: read
  actions: read

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened]

jobs:
  claude:
    uses: synadia-io/ai-workflows/.github/workflows/claude.yml@v2
    with:
      gh_app_id: ${{ vars.CLAUDE_GH_APP_ID }}
      checkout_mode: base
      review_focus: |
        Additionally focus on:
        - NATS documentation style guide compliance (CLAUDE.md rules)
        - Code example tabs use correct structure: CLI first with `default`, `groupId="lang"`, language order CLI > JS > Go > Python > Java > Rust > C#
        - `nats-example` tags used instead of inline Tabs where appropriate
        - MDX validity: Tabs/TabItem imports present, code blocks specify language, no relative imports
        - Writing tone is welcoming and conversational, not dry or robotic
        - Progressive complexity: simple concepts before advanced ones
        - NatsFlow animations used appropriately (message flows, not static config)
        - Examples are realistic (no foo/bar), focused (under 20 lines), and show expected output when helpful
    secrets:
      claude_oauth_token: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
      gh_app_private_key: ${{ secrets.CLAUDE_GH_APP_PRIVATE_KEY }}
